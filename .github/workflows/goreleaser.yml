name: goreleaser
"on":
  push:
    # run only against tags
    tags:
      # only tags starting with v
      - v*
permissions:
  contents: write
  # packages: write
  # issues: write
  # id-token: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned: our .goreleaser.yaml still uses the deprecated-but-functional
          # `brews` (Formula). Do NOT use "~> v2" / "latest" here — a future
          # release that removes `brews` would break publishing without warning.
          version: 2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
